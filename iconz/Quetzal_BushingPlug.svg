<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1"
   id="svg1"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg">
  <title
     id="title1">hex bushing / plug</title>
  <defs
     id="defs1">
    <linearGradient
       id="linearGradient3307">
      <stop
         style="stop-color:#204a87;stop-opacity:1;"
         offset="0"
         id="stop3303" />
      <stop
         style="stop-color:#729fcf;stop-opacity:1;"
         offset="1"
         id="stop3305" />
    </linearGradient>
    <linearGradient
       xlink:href="#linearGradient3307"
       id="linearGradient3309"
       x1="56"
       y1="32"
       x2="6"
       y2="32"
       gradientUnits="userSpaceOnUse" />
  </defs>
  <!-- male threaded stub (left) and hex head (right), side view -->
  <path
     id="outline"
     style="fill:#729fcf;stroke:#204a87;stroke-width:2;stroke-linejoin:round"
     d="M 6,20 H 32 V 8 H 58 V 56 H 32 V 44 H 6 Z" />
  <path
     id="fill"
     style="fill:url(#linearGradient3309);stroke:none"
     d="M 8,22 H 34 V 10 H 56 V 54 H 34 V 42 H 8 Z" />
  <!-- thread hint on the stub -->
  <path
     id="threads"
     style="fill:none;stroke:#204a87;stroke-width:1.5"
     d="M 11,20 9,44 M 17,20 15,44 M 23,20 21,44 M 29,20 27,44" />
  <!-- hex flats -->
  <path
     id="flats"
     style="fill:none;stroke:#204a87;stroke-width:2"
     d="M 32,20 H 58 M 32,44 H 58" />
  <!-- small-end socket -->
  <path
     id="socket"
     style="fill:#ffffff;fill-opacity:0.85;stroke:#204a87;stroke-width:2"
     d="M 58,25 H 46 V 39 H 58" />
  <path
     id="axis"
     style="fill:none;stroke:#000000;stroke-width:2;stroke-dasharray:8, 2, 2, 2"
     d="M 2,32 H 62" />
</svg>
